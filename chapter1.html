<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapter 1 — Science Village</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1420;
        color: #cfe0f5;
        font: 12px ui-monospace, Menlo, Consolas, monospace;
      }
      #stage { position: absolute; inset: 0; }

      /* Dev diagnostics. Hidden unless the URL asks for them (?debug). */
      #log, #perf {
        position: absolute; z-index: 2; display: none;
        white-space: pre; line-height: 1.5; pointer-events: none;
        background: rgba(6, 10, 18, .82);
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 8px; padding: 8px 11px;
      }
      #log  { left: 10px; top: 10px; max-height: 40vh; overflow: hidden; }
      #perf { left: 10px; bottom: 10px; color: #9ff5c8; }
      body.debug #log, body.debug #perf { display: block; }

      /* Shown until the village has finished loading. */
      #boot {
        position: absolute; inset: 0; z-index: 5;
        display: grid; place-content: center; gap: 10px; text-align: center;
        background: #0d1420; color: #cfe0f5;
        font-family: "Segoe UI", "Trebuchet MS", system-ui, Arial, Helvetica, sans-serif;
      }
      #boot h1 { margin: 0; font-size: 22px; font-weight: 700; }
      #boot p  { margin: 0; font-size: 13px; color: #8fa3bf; }
      #boot.done { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <pre id="log"></pre>
    <div id="perf">measuring…</div>

    <div id="boot">
      <h1>Science Village</h1>
      <p>Building the village…</p>
    </div>

    <script>
      // ?debug shows the draw-call and quest overlays.
      if (new URLSearchParams(location.search).has('debug')) {
        document.body.classList.add('debug');
      }
    </script>
    <script type="module" src="/src/science/main.js"></script>
    <style>
      /* A way out at any time, not only after the launch. Deliberately part of
         the PAGE and not the HUD: the HUD is built by the game, so a game that
         fails to start would strand the child with no way back. */
      #rvBackToChapters{
        position:fixed; top:8px; right:10px; z-index:99999;
        display:inline-flex; align-items:center; gap:6px;
        padding:7px 13px; border-radius:999px;
        background:#161c25; color:#e8eef7; border:1px solid #2b3542;
        font:600 13px/1 "Segoe UI","Trebuchet MS",system-ui,Arial,Helvetica,sans-serif;
        text-decoration:none;
      }
      #rvBackToChapters:hover{ border-color:#6fb4ff; }
      #rvBackToChapters:focus-visible{ outline:2px solid #6fb4ff; outline-offset:2px; }
    </style>
    <a id="rvBackToChapters" href="index.html" title="Your progress is saved">&#8592; Chapters</a>
  </body>
</html>
